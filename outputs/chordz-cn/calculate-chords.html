        .ch-keys.inactive { opacity: 0.55; }
        .ch-white {
            position: relative;
            flex: 1;
            height: 100%;
            background: linear-gradient(to bottom, #ffffff 0%, #f8fafc 70%, #e6ebf1 100%);
            border: 1px solid #c2ccd8;
            border-top: none;
            border-radius: 0 0 8px 8px;
            color: #64748b;
            font-size: 0.68rem;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            cursor: pointer;
            transition: background 0.1s ease, box-shadow 0.1s ease;
        }
        .ch-white:hover { background: linear-gradient(to bottom, #ffffff, #dbeafe); }
        .ch-black {
            position: absolute;
            top: 0;
            height: 64%;
            background: linear-gradient(to bottom, #334155 0%, #0b1220 100%);
            border: 1px solid #05080d;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 8px -3px rgba(0, 0, 0, 0.9);
            z-index: 2;
            cursor: pointer;
            transition: background 0.1s ease, box-shadow 0.1s ease;
        }
        .ch-white.picked { background: linear-gradient(to bottom, #a5f3fc, #22d3ee); color: #0f172a; }
        .ch-black.picked { background: linear-gradient(to bottom, #22d3ee, #3b5bfd); }
        .ch-white.right, .ch-black.right { box-shadow: inset 0 0 0 3px #10b981; }
        .ch-white.wrong, .ch-black.wrong { box-shadow: inset 0 0 0 3px #ef4444; }

            position: absolute;

            left: 50%;

        .ch-feedback { min-height: 1.6em; text-align: center; font-weight: 600; margin-top: 12px; font-size: 1rem; }
        .ch-stats { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-around; }
        .ch-stat { text-align: center; min-width: 92px; }
        .ch-stat .num { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); font-family: 'Courier New', monospace; }
        .ch-stat .lbl { font-size: 0.75rem; color: var(--text-secondary); }
        .ch-hint { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.7; }
        .ch-explain { background: var(--surface-light); border-radius: 12px; padding: 14px; margin-top: 12px; font-size: 0.88rem; line-height: 1.8; display: none; }
        table.ch-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.ch-table th, table.ch-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: center; }

    <div class="ch-wrap">

                <button class="btn ghost" id="clear-btn" disabled>🧹 重新选择</button>
                <button class="btn ghost" id="play-btn" disabled>🔊 听这个和弦</button>

            </div>

                在键盘上点满三个音就会自动判分；答完题后，"听这个和弦""查看推演""下一题"才会亮起可以点。

        <div class="ch-panel">

                <strong style="font-size: 0.9rem;">练习记录</strong>
                <div>
                    <button class="btn ghost" id="export-btn" style="padding: 6px 12px; font-size: 0.8rem;">导出 CSV</button>
                    <button class="btn ghost" id="reset-record-btn" style="padding: 6px 12px; font-size: 0.8rem;">清空</button>
                </div>
            </div>
            <table class="ch-table">
                <thead>
                    <tr><th>时间</th><th>模式</th><th>题数</th><th>正确</th><th>正确率</th></tr>

    <script>
        const STORAGE_KEY = "chord-finding-records";
        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11];
        const MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];
        const MAJOR_QUALITIES = ["major", "minor", "minor", "major", "major", "minor", "diminished"];
        const MINOR_QUALITIES = ["minor", "diminished", "major", "minor", "minor", "major", "major"];
        const MAJOR_LABELS = ["I", "ii", "iii", "IV", "V", "vi", "vii°"];
        const MINOR_LABELS = ["i", "ii°", "III", "iv", "v", "VI", "VII"];
        const CHORD_SHAPES = { major: [0, 4, 7], minor: [0, 3, 7], diminished: [0, 3, 6] };
        const QUALITY_NAMES = { major: "大三和弦", minor: "小三和弦", diminished: "减和弦" };

        const EASY_ROOTS = [60, 67, 65];       // C、G、F
        const HARD_ROOTS = [60, 62, 64, 65, 67, 69];

        const state = {
            audioContext: null,
            current: null,
            picked: [],
            answered: false,
            done: 0,
            correct: 0,
            streak: 0,
            best: 0,
        };

        const el = (id) => document.getElementById(id);

        function midiToName(midi) {
            return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
        }

        function playTone(midi, time, duration) {
            // 用共用的多谐波钢琴音色
            window.LegongPiano.play(midi, time, Math.max(0.5, duration));
        }

        function ensureAudio() {
            if (!state.audioContext) {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (state.audioContext.state === "suspended") state.audioContext.resume();
        }

        function buildKeyboard() {
            const wrap = el("keys");
            wrap.innerHTML = "";
            // 两个完整八度，黑白键齐全
            const whiteSemitones = [0, 2, 4, 5, 7, 9, 11];
            const blackAfter = { 0: 1, 1: 3, 3: 6, 4: 8, 5: 10 };
            const sharpPositions = [0, 1, 3, 4, 5];
            const whiteWidth = 100 / 7;

            [48, 60, 72].forEach((octaveMidi, octaveIndex) => {
                const octave = document.createElement("div");
                octave.className = "ch-octave";

                whiteSemitones.forEach((semitone, whiteIndex) => {
                    const midi = octaveMidi + semitone;
                    const key = document.createElement("div");
                    key.className = "ch-white";
                    key.dataset.midi = String(midi);
                    if (semitone === 0) key.textContent = midiToName(midi);
                    key.addEventListener("click", () => pickNote(midi, key));
                    octave.appendChild(key);

                    if (sharpPositions.includes(whiteIndex)) {
                        const blackMidi = octaveMidi + blackAfter[whiteIndex];
                        const blackKey = document.createElement("div");
                        blackKey.className = "ch-black";
                        blackKey.dataset.midi = String(blackMidi);
                        blackKey.style.width = "8.4%";
                        blackKey.style.left = `calc(${(whiteIndex + 1) * whiteWidth}% - 4.2%)`;
                        blackKey.addEventListener("click", () => pickNote(blackMidi, blackKey));
                        octave.appendChild(blackKey);
                    }
                });

                const label = document.createElement("div");
                label.className = "ch-octave-label";
                label.textContent = ["低音 C3", "中音 C4", "高音 C5"][octaveIndex] || "";
                octave.appendChild(label);
                wrap.appendChild(octave);
            });
        }

        function makeQuestion() {
            const advanced = el("advanced-toggle").checked;
            let root = advanced
                ? HARD_ROOTS[Math.floor(Math.random() * HARD_ROOTS.length)]
                : EASY_ROOTS[Math.floor(Math.random() * EASY_ROOTS.length)];
            const isMinor = advanced && Math.random() < 0.35;
            const steps = isMinor ? MINOR_STEPS : MAJOR_STEPS;
            const qualities = isMinor ? MINOR_QUALITIES : MAJOR_QUALITIES;
            const labels = isMinor ? MINOR_LABELS : MAJOR_LABELS;

            let degree;
            if (advanced) {
                degree = Math.floor(Math.random() * 7);
            } else {
                degree = [0, 3, 4][Math.floor(Math.random() * 3)];
            }

            const quality = qualities[degree];
            if (!advanced && quality !== "major") degree = 0;
            const finalQuality = qualities[degree];
            const rootNote = root + steps[degree];
            const notes = CHORD_SHAPES[finalQuality].map((interval) => rootNote + interval);
            const scaleNotes = steps.map((step) => root + step);

            return {
                root,
                isMinor,
                degree,
                label: labels[degree],
                quality: finalQuality,
                notes,
                scaleNotes,
                keyLabel: `${NOTE_NAMES[root % 12]} ${isMinor ? "小调" : "大调"}`,
                advanced,
            };
        }

        function renderQuestion() {
            const current = state.current;
            el("question").textContent = `${current.keyLabel}里，${current.label} 级是什么和弦？请在键盘上点出它的三个音。`;
            el("subhint").textContent = `提示：从音阶的第 ${current.degree + 1} 个音开始往上搭，答案是一个${QUALITY_NAMES[current.quality]}。`;
        }

        function pickNote(midi, element) {
            if (!state.current) {
                ensureAudio();
                if (el("sound-toggle").checked) {
                    playTone(midi, state.audioContext.currentTime + 0.02, 0.6);
                }
                el("feedback").textContent = "先点上面的“开始练习”出一题，再点琴键作答。";
                el("feedback").style.color = "var(--text-secondary)";
                return;
            }
            if (state.answered) return;

            const existingIndex = state.picked.indexOf(midi);
            if (existingIndex >= 0) {
                state.picked.splice(existingIndex, 1);
                element.classList.remove("picked");
            } else {
                if (state.picked.length >= 3) {
                    el("feedback").textContent = "已经选了三个音，想换的话点“重新选择”。";
                    return;
                }
                state.picked.push(midi);
                element.classList.add("picked");
                if (el("sound-toggle").checked) {
                    ensureAudio();
                    playTone(midi, state.audioContext.currentTime + 0.02, 0.6);
                }
            }

            el("clear-btn").disabled = state.picked.length === 0;
            if (state.picked.length === 3) checkAnswer();
        }

        function normalize(notes) {
            return notes.map((midi) => ((midi % 12) + 12) % 12).sort((a, b) => a - b).join(",");
        }

        function checkAnswer() {
            if (state.answered) return;
            state.answered = true;

            const current = state.current;
            const isRight = normalize(state.picked) === normalize(current.notes);

            document.querySelectorAll(".ch-white, .ch-black").forEach((key) => {
                const midi = Number(key.dataset.midi);
                const isAnswer = current.notes.some((note) => ((note % 12) + 12) % 12 === ((midi % 12) + 12) % 12);
                const isPicked = state.picked.includes(midi);
                if (isAnswer) key.classList.add("right");
                else if (isPicked) key.classList.add("wrong");
            });

            state.done += 1;
            const answerText = current.notes.map(midiToName).join(" + ");
            if (isRight) {
                state.correct += 1;
                state.streak += 1;
                state.best = Math.max(state.best, state.streak);
                el("feedback").textContent = `答对了：${current.label} 级是 ${answerText}。`;
                el("feedback").style.color = "var(--accent-happy, #10b981)";
            } else {
                state.streak = 0;
                el("feedback").textContent = `答错了，正确答案是 ${answerText}。点“查看推演”看它是怎么来的。`;
                el("feedback").style.color = "var(--accent-tense, #ef4444)";
            }

            el("play-btn").disabled = false;
            el("explain-btn").disabled = false;
            el("next-btn").disabled = false;
            el("clear-btn").disabled = true;
            updateStats();
        }

        function playChord() {
            if (!state.current) return;
            ensureAudio();
            const start = state.audioContext.currentTime + 0.2;
            state.current.notes.forEach((midi) => playTone(midi, start, 1.2));
        }

        function showExplain() {
            const current = state.current;
            const names = current.scaleNotes.map((midi) => NOTE_NAMES[((midi % 12) + 12) % 12]);
            const chordNames = current.notes.map(midiToName);
            const shapes = CHORD_SHAPES[current.quality];
            el("explain").innerHTML =
                `<strong>怎么推出来的：</strong><br>` +
                `1. ${current.keyLabel}音阶是 ${names.join(" - ")}。<br>` +
                `2. 第 ${current.degree + 1} 个音是 <strong>${chordNames[0]}</strong>，它就是和弦的根音。<br>` +
                `3. ${QUALITY_NAMES[current.quality]}的构成是“根音 + ${shapes[1]} 个半音 + ${shapes[2]} 个半音”，` +
                `也就是 ${chordNames.join(" + ")}。<br>` +
                `4. 也可以这样记：在音阶里从根音开始“隔一个取一个”，取到第 1、3、5 个音。`;
            el("explain").style.display = "block";
        }

        function updateStats() {
            el("stat-done").textContent = String(state.done);
            el("stat-correct").textContent = String(state.correct);
            el("stat-rate").textContent = state.done ? `${Math.round((state.correct / state.done) * 100)}%` : "-";
            el("stat-streak").textContent = String(state.streak);
            el("stat-best").textContent = String(state.best);
        }

        function nextQuestion() {
            el("keys").classList.remove("inactive");
            state.current = makeQuestion();
            state.picked = [];
            state.answered = false;
            document.querySelectorAll(".ch-white, .ch-black").forEach((key) => {
                key.classList.remove("picked", "right", "wrong");
            });
            el("feedback").textContent = "";
            el("explain").style.display = "none";
            el("clear-btn").disabled = true;
            el("play-btn").disabled = true;
            el("explain-btn").disabled = true;
            el("next-btn").disabled = true;
            renderQuestion();
        }

        function saveRound() {
            if (!state.done) return;
            const records = loadRecords();
            records.unshift({
                time: new Date().toLocaleString("zh-CN"),
                mode: el("advanced-toggle").checked ? "进阶" : "基础",
                total: state.done,
                correct: state.correct,
                rate: Math.round((state.correct / state.done) * 100),
            });
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records.slice(0, 30)));
            } catch (error) {
                // 忽略
            }
            renderRecords();
        }

        function loadRecords() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            } catch (error) {
                return [];
            }
        }

        function renderRecords() {
            const records = loadRecords();
            const body = el("records-body");
            if (!records.length) {
                body.innerHTML = '<tr><td colspan="5" class="ch-hint">暂无记录</td></tr>';
                return;
            }
            body.innerHTML = records
                .slice(0, 10)
                .map((record) =>
                    `<tr><td>${record.time}</td><td>${record.mode}</td><td>${record.total}</td><td>${record.correct}</td><td>${record.rate}%</td></tr>`)
                .join("");
        }

        el("start-btn").addEventListener("click", () => {
            ensureAudio();
            el("start-btn").textContent = "🔄 重新开始一轮";
            nextQuestion();
        });
        el("clear-btn").addEventListener("click", () => {
            state.picked = [];
            document.querySelectorAll(".ch-white, .ch-black").forEach((key) => key.classList.remove("picked"));
            el("clear-btn").disabled = true;
            el("feedback").textContent = "";
        });
        el("play-btn").addEventListener("click", playChord);
        el("explain-btn").addEventListener("click", showExplain);
        el("next-btn").addEventListener("click", () => {
            if (state.done > 0 && state.done % 10 === 0 && state.answered) {
                saveRound();
                el("feedback").textContent = "已完成 10 题，成绩已记录。可以继续下一题。";
            }
            nextQuestion();
        });
        el("advanced-toggle").addEventListener("change", () => {
            state.done = 0;
            state.correct = 0;
            state.streak = 0;
            state.best = 0;
            state.current = null;
            state.picked = [];
            updateStats();
            document.querySelectorAll(".ch-white, .ch-black").forEach((key) => {
                key.classList.remove("picked", "right", "wrong");
            });
            el("question").textContent = "已切换模式，点“开始练习”重新开始";
            el("subhint").textContent = "";
            el("feedback").textContent = "";
            el("explain").style.display = "none";
            el("play-btn").disabled = true;
            el("explain-btn").disabled = true;
            el("next-btn").disabled = true;
        });
        el("export-btn").addEventListener("click", () => {
            const records = loadRecords();
            const header = "时间,模式,题数,正确数,正确率";
            const rows = records.map((record) => `${record.time},${record.mode},${record.total},${record.correct},${record.rate}`);
            const blob = new Blob(["\ufeff" + [header, ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "和弦找音记录.csv";
            link.click();
        });
        el("reset-record-btn").addEventListener("click", () => {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (error) {
                // 忽略
            }
            renderRecords();
        });

        buildKeyboard();
        el("keys").classList.add("inactive");
        renderRecords();
        updateStats();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () {});
            });
        }
    </script>
