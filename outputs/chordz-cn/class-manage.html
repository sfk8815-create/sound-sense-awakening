    <script>
        (function () {
            try {
                var saved = JSON.parse(localStorage.getItem("lg-modes") || "{}");
                var root = document.documentElement;
                if (!saved || typeof saved !== "object") saved = {};
                /* 学生端是亮色界面：没手动选过就默认亮色，避免点进来像换了个 App */
                if (saved.light === undefined) {
                    saved.light = true;
                    try { localStorage.setItem("lg-modes", JSON.stringify(saved)); } catch (e) {}
                }
                if (saved.light) root.classList.add("lg-light");
                if (saved.focus) root.classList.add("lg-focus");
                if (saved.large) root.classList.add("lg-large");
            } catch (error) {}
        })();
    </script>

<script>
/* 首屏就套用已保存的配色与明暗，避免先闪一下默认色 */
(function () {
    try {
        var d = document.documentElement;
        var m = JSON.parse(localStorage.getItem("lg-modes") || "{}");
        if (!m || typeof m !== "object") m = {};
        if (m.light === undefined) {
            m.light = true;
            try { localStorage.setItem("lg-modes", JSON.stringify(m)); } catch (e) {}
        }
        if (m.palette) d.setAttribute("data-ys-palette", m.palette);
        d.classList.toggle("lg-light", !!m.light);
        d.classList.toggle("ys-dark", !m.light);
        if (m.large) d.classList.add("lg-large");
    } catch (e) {}
})();
</script>

    <div class="cm-wrap">
        <header style="text-align: center; margin-bottom: 16px;">
            <div style="font-size: 2.2rem;">👩‍🏫</div>
            <h1 style="margin: 0 0 4px 0; font-size: 1.7rem;">班级管理</h1>
            <p class="cm-hint" style="margin: 0;">建立学生名单，查看每个人的练习情况，导出全班成绩。</p>
        </header>

        <div class="cm-panel">
            <div class="cm-row">
                <input class="cm-input" id="name-input" placeholder="输入学生姓名，按回车添加">
                <button class="btn" id="add-btn">添加学生</button>
                <button class="btn ghost" id="roster-btn">粘贴名单批量添加</button>
            </div>
            <div id="bulk-area" style="display: none; margin-top: 12px;">
                <textarea class="cm-input" id="bulk-input" placeholder="每行一个名字，或直接用逗号、空格分隔"></textarea>
                <div class="cm-row" style="margin-top: 10px;">
                    <button class="btn" id="bulk-confirm">确认添加</button>
                    <button class="btn ghost" id="bulk-cancel">取消</button>
                </div>
            </div>
            <p class="cm-hint" style="margin: 12px 0 0 0;">
                名单保存在本机。学生在节奏闯关页面填写自己的姓名后，成绩就会自动记录到对应同学名下。
            </p>
        </div>

        <div class="cm-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;">
                <strong style="font-size: 0.95rem;">班级成绩</strong>
                <div>
                    <button class="btn ghost" id="export-btn" style="padding: 6px 12px; font-size: 0.8rem;">导出全班 CSV</button>
                    <button class="btn ghost" id="clear-record-btn" style="padding: 6px 12px; font-size: 0.8rem;">清空所有练习记录</button>
                </div>
            </div>
            <table class="cm-table">
                <thead>
                    <tr>
                        <th>学生</th><th>练习次数</th><th>平均准确率</th><th>平均偏差</th>
                        <th>平均得分</th><th>最好成绩</th><th>最近练习</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="8" class="cm-empty">还没有学生，先在上面添加</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ROSTER_KEY = "legong-class-roster";
        const RECORD_KEY = "rhythm-training-records";
        const el = (id) => document.getElementById(id);

        function loadRoster() {
            try {
                const saved = JSON.parse(localStorage.getItem(ROSTER_KEY) || "[]");
                return Array.isArray(saved) ? saved.filter((name) => typeof name === "string" && name.trim()) : [];
            } catch (error) {
                return [];
            }
        }

        function saveRoster(roster) {
            try {
                localStorage.setItem(ROSTER_KEY, JSON.stringify(roster));
            } catch (error) {
                // 存储不可用时忽略
            }
        }

        function loadRecords() {
            try {
                const saved = JSON.parse(localStorage.getItem(RECORD_KEY) || "[]");
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        function addNames(names) {
            const roster = loadRoster();
            names.forEach((name) => {
                const clean = String(name).trim();
                if (clean && !roster.includes(clean)) roster.push(clean);
            });
            saveRoster(roster);
            render();
        }

        function statsFor(name, records) {
            const mine = records.filter((record) => (record.student || "本人") === name);
            if (!mine.length) return { count: 0 };
            const average = (key) =>
                Math.round(mine.reduce((sum, record) => sum + (Number(record[key]) || 0), 0) / mine.length);
            return {
                count: mine.length,
                accuracy: average("accuracy"),
                offset: average("avgOffset"),
                score: average("score"),
                best: Math.max(...mine.map((record) => Number(record.score) || 0)),
                last: mine[0].time || "",
            };
        }

        function render() {
            const roster = loadRoster();
            const records = loadRecords();
            const known = new Set(roster);
            records.forEach((record) => known.add(record.student || "本人"));
            const allNames = Array.from(known);

            const body = el("table-body");
            if (!allNames.length) {
                body.innerHTML = '<tr><td colspan="8" class="cm-empty">还没有学生，先在上面添加</td></tr>';
                return;
            }

            body.innerHTML = allNames
                .map((name) => {
                    const stat = statsFor(name, records);
                    const inRoster = roster.includes(name);
                    return `<tr>
                        <td class="cm-name">${name}${inRoster ? "" : "（未在名单中）"}</td>
                        <td>${stat.count}</td>
                        <td>${stat.count ? stat.accuracy + "%" : "-"}</td>
                        <td>${stat.count ? stat.offset + " ms" : "-"}</td>
                        <td>${stat.count ? stat.score : "-"}</td>
                        <td>${stat.count ? stat.best : "-"}</td>
                        <td>${stat.last || "-"}</td>
                        <td>${inRoster ? `<button class="cm-del" data-name="${name}">移除</button>` : ""}</td>
                    </tr>`;
                })
                .join("");

            body.querySelectorAll(".cm-del").forEach((button) => {
                button.addEventListener("click", () => {
                    const name = button.dataset.name;
                    saveRoster(loadRoster().filter((item) => item !== name));
                    render();
                });
            });
        }

        function exportCsv() {
            const roster = loadRoster();
            const records = loadRecords();
            const names = new Set(roster);
            records.forEach((record) => names.add(record.student || "本人"));
            const header = "学生,练习次数,平均准确率,平均偏差(ms),平均得分,最好成绩,最近练习";
            const rows = Array.from(names).map((name) => {
                const stat = statsFor(name, records);
                return [name, stat.count, stat.count ? stat.accuracy : "", stat.count ? stat.offset : "",
                    stat.count ? stat.score : "", stat.count ? stat.best : "", stat.last || ""].join(",");
            });
            const blob = new Blob(["\ufeff" + [header, ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "班级成绩.csv";
            link.click();
        }

        function addFromInput() {
            const value = el("name-input").value.trim();
            if (!value) return;
            addNames([value]);
            el("name-input").value = "";
        }

        el("add-btn").addEventListener("click", addFromInput);
        el("name-input").addEventListener("keydown", (event) => {
            if (event.key === "Enter") addFromInput();
        });
        el("roster-btn").addEventListener("click", () => {
            const area = el("bulk-area");
            area.style.display = area.style.display === "none" ? "block" : "none";
        });
        el("bulk-confirm").addEventListener("click", () => {
            const names = el("bulk-input").value.split(/[\n,，、\s]+/).filter(Boolean);
            addNames(names);
            el("bulk-input").value = "";
            el("bulk-area").style.display = "none";
        });
        el("bulk-cancel").addEventListener("click", () => {
            el("bulk-area").style.display = "none";
        });
        el("export-btn").addEventListener("click", exportCsv);
        el("clear-record-btn").addEventListener("click", () => {
            if (!window.confirm("确定要清空本机所有节奏闯关练习记录吗？此操作不可恢复。")) return;
            try {
                localStorage.removeItem(RECORD_KEY);
            } catch (error) {
                // 忽略
            }
            render();
        });

        render();
    </script>
