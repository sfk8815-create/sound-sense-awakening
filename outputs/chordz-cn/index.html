<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="音感觉醒">
    <title>音感觉醒</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        html, body { margin: 0; height: 100%; background: #f2f5ff; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: #74819e; font-size: .95rem;
        }
        .boot-logo {
            width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 28px;
            background: linear-gradient(135deg, #3b5bfd, #06b6d4);
            display: flex; align-items: center; justify-content: center; font-size: 44px;
            box-shadow: 0 20px 44px -18px rgba(59, 91, 253, .8);
        }
        .boot { text-align: center; }
        a { color: #3b5bfd; }
    </style>
</head>
<body>
    <div class="boot">
        <div class="boot-logo">🎵</div>
        <div>正在进入「音感觉醒」…</div>
        <div style="margin-top:10px;font-size:.84rem">如果没有自动跳转，<a href="start.html">点这里开始</a></div>
    </div>
    <script>
        /* 入口统一指向学生端欢迎页 start.html（原来指向教师工作台 home.html）。
           想直接进完整功能表，访问 home.html。 */
        (function () {
            var target = "start.html";
            try {
                var params = new URLSearchParams(location.search);
                if (params.get("full") === "1") target = "home.html";
            } catch (e) {}
            location.replace(target);
        })();
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () {});
            });
        }
    </script>
</body>
</html>
