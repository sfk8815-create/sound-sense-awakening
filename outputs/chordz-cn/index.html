<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="音感觉醒">
    <title>音感觉醒</title>
    <link rel="manifest" href="manifest.json">
    <script>
        // Router: redirect to last visited page or home.html as fallback
        (function() {
            const LAST_PAGE_KEY = 'chordz-last-page';

            try {
                const lastPage = localStorage.getItem(LAST_PAGE_KEY);

                // Redirect to last visited page, or home.html if none
                if (lastPage && lastPage !== 'index.html' && lastPage !== '') {
                    window.location.href = "home.html";
                } else {
                    window.location.href = 'home.html';
                }
            } catch (e) {
                // If localStorage fails, just go to training
                window.location.href = 'home.html';
            }
        })();
    </script>
    <link rel="stylesheet" href="theme.css">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
        (function () {
            try {
                var saved = JSON.parse(localStorage.getItem("lg-modes") || "{}");
                var root = document.documentElement;
                if (saved.light) root.classList.add("lg-light");
                if (saved.focus) root.classList.add("lg-focus");
                if (saved.large) root.classList.add("lg-large");
            } catch (error) {}
        })();
    </script>
    <script src="modes.js" defer></script>
    <script src="ui-controls.js" defer></script>
    <script src="piano-tone.js"></script>
    <script src="scroll-guard.js" defer></script>
</head>
<body>
    <!-- This page immediately redirects, so body is empty -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js").catch(function () {});
            });
        }
    </script>
</body>
</html>
