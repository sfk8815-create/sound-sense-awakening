    <style>
        .detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        .detail-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .detail-name {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .scale-type-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .scale-type-badge.major {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.3));
            color: var(--accent-happy);
            border: 2px solid var(--accent-happy);
        }

        .scale-type-badge.minor {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.3));
            color: var(--accent-sad);
            border: 2px solid var(--accent-sad);
        }

        .detail-card {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .progression-display {
            text-align: center;
            margin: 30px 0;
            padding: 25px;
            background: var(--background);
            border-radius: 12px;
        }

        .progression-display .roman {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .progression-display .chords {
            font-size: 1.8rem;
            color: var(--accent-happy);
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .chord-breakdown-section {
            margin: 30px 0;
        }

        .chord-breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chord-item {
            background: var(--surface-light);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .chord-item.active-chord {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-left: 4px solid var(--accent-happy);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
            transform: scale(1.05);
        }

        .chord-item-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .chord-item.active-chord .chord-item-name {
            color: white;
        }

        .chord-item-notes {
            font-size: 1.1rem;
            color: var(--accent-happy);
            font-family: 'Courier New', monospace;
            transition: color 0.3s ease;
        }

        .chord-item.active-chord .chord-item-notes {
            color: white;
        }

        .description-section {
            margin: 30px 0;
            line-height: 1.8;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .action-btn.primary {
            background: var(--primary-color);
            color: white;
        }

        .action-btn.primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: var(--surface-light);
            color: var(--text-primary);
        }

        .action-btn.secondary:hover {
            background: var(--primary-color);
            color: white;
        }

        .key-selector-inline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: var(--surface-light);
            border-radius: 8px;
        }

        .key-selector-inline label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .key-selector-inline select {
            padding: 10px 15px;
            font-size: 1rem;
            background: var(--background);
            color: var(--text-primary);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .detail-card {
                padding: 25px;
            }

            .detail-name {
                font-size: 2rem;
            }

            .progression-display .roman {
                font-size: 1.5rem;
            }

            .progression-display .chords {
                font-size: 1.3rem;
            }
        }
    </style>

    <script>
        // Global piano instance
        let pianoInstance = null;

        // Starred progressions management
        const STARRED_KEY = 'chordz-starred-progressions';

        function getStarredProgressions() {
            try {
                const starred = localStorage.getItem(STARRED_KEY);
                return starred ? JSON.parse(starred) : [];
            } catch (e) {
                console.error('Failed to load starred progressions:', e);
                return [];
            }
        }

        function isProgressionStarred(chordParam) {
            const starred = getStarredProgressions();
            return starred.includes(chordParam);
        }

        function toggleStar(chordParam) {
            const starred = getStarredProgressions();
            const index = starred.indexOf(chordParam);

            if (index > -1) {
                // Remove star
                starred.splice(index, 1);
            } else {
                // Add star
                starred.push(chordParam);
            }

            try {
                localStorage.setItem(STARRED_KEY, JSON.stringify(starred));
            } catch (e) {
                console.error('Failed to save starred progressions:', e);
            }

            return index === -1; // Return new starred state
        }

        function updateStarButton(chordParam) {
            const isStarred = isProgressionStarred(chordParam);
            const starIcon = document.getElementById('star-icon');
            const starText = document.getElementById('star-text');

            if (isStarred) {
                starIcon.textContent = '⭐';
                starText.textContent = 'Remove from favorites';
            } else {
                starIcon.textContent = '☆';
                starText.textContent = '收藏';
            }
        }

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        // Get key from URL, then localStorage, then default to 'C'
        let selectedKey = urlParams.get('key');
        if (!selectedKey || selectedKey === 'all') {
            const savedNote = localStorage.getItem('rootNote');
            selectedKey = (savedNote && savedNote !== 'all') ? savedNote : 'C';
        }

        // Get progression data - support both old (id) and new (chord) formats
        let progression = null;
        let chordParam = urlParams.get('chord');

        if (chordParam) {
            // New format: chord parameter with roman numerals (e.g., "I-vi-IV-V")
            const romanNumerals = chordParam.split('-');

            // Check if this matches any progression in CHORD_PROGRESSIONS
            const matchingProgression = CHORD_PROGRESSIONS.find(p =>
                p.progression.join('-') === chordParam
            );

            if (matchingProgression) {
                // Use the full progression data from CHORD_PROGRESSIONS
                progression = matchingProgression;
            } else {
                // Custom progression - create object from URL parameters
                const firstNumeral = romanNumerals[0];
                const keyMode = firstNumeral === firstNumeral.toLowerCase() ? 'minor' : 'major';

                progression = {
                    name: 'Custom Progression',
                    progression: romanNumerals,
                    keyMode: keyMode,
                    mood: [],
                    description: `A custom chord progression: ${romanNumerals.join(' - ')}`
                };
            }
        } else {
            // Old format: id parameter
            const progressionIndex = parseInt(urlParams.get('id'));
            progression = CHORD_PROGRESSIONS[progressionIndex];
            // Convert to chord param for star functionality
            if (progression) {
                chordParam = progression.progression.join('-');
            }
        }

        if (!progression) {
            document.querySelector('.detail-container').innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <h2 style="color: var(--text-primary);">Chord progression not found</h2>
                    <p style="color: var(--text-secondary); margin: 20px 0;">The requested chord progression could not be found.</p>
                    <a href="chord-progressions.html" class="action-btn primary">← Back to Search</a>
                </div>
            `;
        } else {
            // Display the progression details
            document.getElementById('chord-name').textContent = progression.name;

            // Display scale type badge
            const scaleTypeName = progression.keyMode === 'major' ? 'Major' : 'Minor';
            const scaleTypeBadge = `<span class="scale-type-badge ${progression.keyMode}">${scaleTypeName} Key</span>`;
            document.getElementById('scale-type-badge').innerHTML = scaleTypeBadge;

            // Display mood tags (if any)
            const moodTags = progression.mood && progression.mood.length > 0
                ? progression.mood.map(mood =>
                    `<span class="mood-tag mood-${mood}">${mood}</span>`
                ).join('')
                : '';
            document.getElementById('mood-tags').innerHTML = moodTags;

            // Set initial key
            document.getElementById('key-selector').value = selectedKey;

            // Update display function
            function updateDisplay() {
                selectedKey = document.getElementById('key-selector').value;

                // Display Roman numerals
                document.getElementById('roman-numerals').textContent = progression.progression.join(' - ');

                // Transpose and display chords
                const chords = transposeProgression(progression.progression, selectedKey, progression.keyMode);
                document.getElementById('chord-names').textContent = chords.join(' - ');

                // Display chord breakdown
                const breakdownHTML = chords.map((chord, index) => {
                    const notes = getChordNotes(chord);
                    return `
                        <div class="chord-item" data-chord-index="${index}">
                            <div class="chord-item-name">${chord}</div>
                            <div class="chord-item-notes">${notes.join(' + ')}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('chord-breakdown').innerHTML = breakdownHTML;

                // Update piano visualization
                const displayNames = chords.map((chord, i) => `${progression.progression[i]} (${chord})`);

                if (pianoInstance) {
                    pianoInstance.updateChords(chords, displayNames);
                } else {
                    pianoInstance = new AnimatedPiano('piano-animation-container', chords, displayNames);
                }
            }

            // Display description
            document.getElementById('chord-description').textContent = progression.description;

            // Event listener for key change
            document.getElementById('key-selector').addEventListener('change', updateDisplay);

            // Event listener for "Another Random" button
            document.getElementById('another-random').addEventListener('click', () => {
                const randomProgression = CHORD_PROGRESSIONS[Math.floor(Math.random() * CHORD_PROGRESSIONS.length)];
                const randomChordParam = randomProgression.progression.join('-');
                window.location.href = `chord-detail.html?chord=${randomChordParam}&key=${selectedKey}`;
            });

            // Event listener for star button
            const starBtn = document.getElementById('star-btn');
            if (starBtn) {
                // Update initial state
                updateStarButton(chordParam);

                // Add click handler
                starBtn.addEventListener('click', () => {
                    toggleStar(chordParam);
                    updateStarButton(chordParam);
                });
            }

            // Initial display
            updateDisplay();
        }

        // Cleanup Tone.js when leaving the page to prevent hanging notes
        window.addEventListener('beforeunload', () => {
            if (pianoInstance) {
                pianoInstance.destroy();
            }
        });
    </script>
