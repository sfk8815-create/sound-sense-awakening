    <script>
        (function () {
            try {
                var saved = JSON.parse(localStorage.getItem("lg-modes") || "{}");
                var root = document.documentElement;
                if (!saved || typeof saved !== "object") saved = {};
                /* 学生端是亮色界面：没手动选过就默认亮色，避免点进来像换了个 App */
                if (saved.light === undefined) {
                    saved.light = true;
                    try { localStorage.setItem("lg-modes", JSON.stringify(saved)); } catch (e) {}
                }
                if (saved.light) root.classList.add("lg-light");
                if (saved.focus) root.classList.add("lg-focus");
                if (saved.large) root.classList.add("lg-large");
            } catch (error) {}
        })();
    </script>

    <script src="ui-controls.js" defer></script>
    <script src="piano-tone.js"></script>
    <script src="scroll-guard.js" defer></script>
<link rel="stylesheet" href="yx-theme.css">
<script>
/* 首屏就套用已保存的配色与明暗，避免先闪一下默认色 */
(function () {
    try {
        var d = document.documentElement;
        var m = JSON.parse(localStorage.getItem("lg-modes") || "{}");
        if (!m || typeof m !== "object") m = {};
        if (m.light === undefined) {
            m.light = true;
            try { localStorage.setItem("lg-modes", JSON.stringify(m)); } catch (e) {}
        }
        if (m.palette) d.setAttribute("data-ys-palette", m.palette);
        d.classList.toggle("lg-light", !!m.light);
        d.classList.toggle("ys-dark", !m.light);
        if (m.large) d.classList.add("lg-large");
    } catch (e) {}
})();
</script>

        <header>
            <div class="header-icon">📖</div>
            <h1>进行曲库</h1>
            <p class="subtitle">按情绪和调性查找和弦进行</p>
        </header>

        <div class="controls">
            <div class="input-section">
                <label for="note-selector" style="display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-primary);">主音：</label>
                <select id="note-selector" style="width: 100%; padding: 12px; font-size: 1rem; background: var(--background); color: var(--text-primary); border: 2px solid var(--primary-color); border-radius: 8px; cursor: pointer; height: 48px; box-sizing: border-box;">
                    <option value="all">全部调性</option>
                    <option value="C">C</option>
                    <option value="C#">C# / Db</option>
                    <option value="D">D</option>
                    <option value="D#">D# / Eb</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F# / Gb</option>
                    <option value="G">G</option>
                    <option value="G#">G# / Ab</option>
                    <option value="A">A</option>
                    <option value="A#">A# / Bb</option>
                    <option value="B">B</option>
                </select>
            </div>

            <div class="filter-section">
                <div class="mood-filters">
                    <button class="mood-filter active" data-filter="all">全部</button>
                    <button class="mood-filter" data-filter="starred" data-type="starred">⭐ 已收藏</button>
                    <button class="mood-filter" data-filter="major" data-type="scale">大调</button>
                    <button class="mood-filter" data-filter="minor" data-type="scale">小调</button>
                    <button class="mood-filter" data-filter="borrowed" data-type="borrowed">借用和弦</button>
                    <button class="mood-filter" data-filter="happy" data-type="mood">欢快</button>
                    <button class="mood-filter" data-filter="uplifting" data-type="mood">振奋</button>
                    <button class="mood-filter" data-filter="sad" data-type="mood">悲伤</button>
                    <button class="mood-filter" data-filter="melancholic" data-type="mood">忧郁</button>
                    <button class="mood-filter" data-filter="dreamy" data-type="mood">梦幻</button>
                    <button class="mood-filter" data-filter="unsettling" data-type="mood">不安</button>
                    <button class="mood-filter" data-filter="uncomfortable" data-type="mood">紧张</button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button id="random-chord-btn" style="padding: 14px 32px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(99, 102, 241, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(99, 102, 241, 0.3)'">
                    🎲 随机和弦进行
                </button>
            </div>
        </div>

        <div id="results" class="results">
            <!-- Chord progression cards will be dynamically inserted here -->
        </div>
