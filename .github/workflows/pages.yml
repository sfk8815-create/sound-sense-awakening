name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # 站点根 = 应用目录，这样公开地址是 /start.html 而不是 /outputs/chordz-cn/start.html
          # （商店打包工具和陌生人都需要短而稳定的 URL；站点内全是相对路径，挪根安全）
          path: outputs/chordz-cn
      - id: deployment
        uses: actions/deploy-pages@v5
