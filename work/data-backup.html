<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f14">
    <meta name="apple-mobile-web-app-title" content="乐感工坊">
    <title>数据备份 - 乐感工坊</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="guide-styles.css">
    <script src="page-memory.js"></script>
    <style>
        .db-wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .db-panel { background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .db-panel h2 { margin: 0 0 10px 0; font-size: 1.05rem; color: var(--secondary-color); }
        .db-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .db-hint { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.7; margin: 8px 0 0 0; }
        .db-stat { font-size: 0.9rem; color: var(--text-primary); }
        table.db-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; margin-top: 10px; }
        table.db-table th, table.db-table td {
            padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left;
        }
        table.db-table th { color: var(--secondary-color); font-weight: 700; }
        table.db-table td.num { text-align: right; }
        .db-empty { color: var(--text-secondary); font-size: 0.84rem; padding: 10px 0; }
        .db-danger { border: 1px solid rgba(239, 68, 68, 0.35); }
        .db-danger h2 { color: #ef4444; }
        .db-msg { font-size: 0.84rem; margin-top: 10px; }
        .db-msg.ok { color: #34d399; }
        .db-msg.err { color: #ef4444; }
        select.db-select, input.db-input {
            padding: 9px 12px; font-size: 0.9rem; font-family: inherit;
            background: var(--background); color: var(--text-primary);
            border: 1px solid var(--surface-light); border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav class="main-nav"></nav>

    <div class="db-wrap">
        <header style="text-align: center; margin-bottom: 16px;">
            <div style="font-size: 2.2rem;">🗄️</div>
            <h1 style="margin: 0 0 4px 0; font-size: 1.7rem;">数据备份与迁移</h1>
            <p class="db-hint" style="margin: 0;">练习记录都存在本机浏览器里，导出一次就能换电脑、换浏览器继续用。</p>
        </header>

        <div class="db-panel">
            <h2>本机数据总览</h2>
            <div class="db-stat" id="stat-line">正在统计…</div>
            <div id="stat-table"></div>
        </div>

        <div class="db-panel">
            <h2>导出备份</h2>
            <div class="db-row">
                <button class="btn" id="export-json">导出全部数据（.json）</button>
                <button class="btn ghost" id="export-csv">导出成绩汇总（.csv）</button>
                <button class="btn ghost" id="refresh">刷新统计</button>
            </div>
            <p class="db-hint">JSON 是完整备份，换设备时导入这个文件即可；CSV 可用 Excel、WPS 打开，适合放进汇报材料和作业统计。</p>
            <div class="db-msg" id="export-msg"></div>
        </div>

        <div class="db-panel">
            <h2>导入备份</h2>
            <div class="db-row">
                <input class="db-input" type="file" id="import-file" accept=".json,application/json">
                <select class="db-select" id="import-mode">
                    <option value="merge">合并：保留现有记录</option>
                    <option value="replace">覆盖：清空后写入备份</option>
                </select>
                <button class="btn" id="import-run">开始导入</button>
            </div>
            <p class="db-hint">只接受本软件导出的备份文件，导入前会先校验格式，格式不对不会动原有数据。</p>
            <div class="db-msg" id="import-msg"></div>
        </div>

        <div class="db-panel db-danger">
            <h2>清空数据</h2>
            <div class="db-row">
                <input class="db-input" id="wipe-word" placeholder="输入 清空 两个字以确认">
                <button class="btn ghost" id="wipe-run">清空全部数据</button>
            </div>
            <p class="db-hint">清空会删除本机全部练习记录、关卡进度和学生名单，且不能撤销。建议先导出备份再操作。</p>
            <div class="db-msg" id="wipe-msg"></div>
        </div>
    </div>

    <script>
        (function () {
            var APP_TAG = "legong-app-backup";
            var VERSION = 1;

            var LABELS = [
                ["class-roster", "班级管理 / 学生名单"],
                ["class-records", "班级管理 / 练习记录"],
                ["legong-homework", "作业布置 / 作业与完成情况"],
                ["rhythm-level-progress", "节奏闯关 / 关卡进度"],
                ["rhythm-custom-hits", "节奏闯关 / 自定义节奏型"],
                ["rhythm-student", "节奏闯关 / 当前学生"],
                ["rhythm-records", "节奏闯关 / 成绩记录"],
                ["score-records", "视奏训练 / 成绩记录"],
                ["theory-records", "乐理练习 / 成绩记录"],
                ["chordz-training-records", "和弦练习 / 成绩记录"],
                ["chordz-speed-records", "60 秒速弹 / 成绩记录"],
                ["chordz-play-chord-records", "和弦弹奏 / 成绩记录"],
                ["lg-modes", "显示与设置"],
            ];

            function labelFor(key) {
                for (var i = 0; i < LABELS.length; i++) {
                    if (key.indexOf(LABELS[i][0]) === 0) return LABELS[i][1];
                }
                return key;
            }

            function allKeys() {
                var out = [];
                try {
                    for (var i = 0; i < localStorage.length; i++) {
                        var key = localStorage.key(i);
                        if (key) out.push(key);
                    }
                } catch (error) {
                    return [];
                }
                return out.sort();
            }

            function readAll() {
                var data = {};
                allKeys().forEach(function (key) {
                    data[key] = localStorage.getItem(key);
                });
                return data;
            }

            function byteSize(text) {
                try {
                    return new Blob([text]).size;
                } catch (error) {
                    return text ? text.length : 0;
                }
            }

            function prettySize(bytes) {
                if (bytes < 1024) return bytes + " B";
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
                return (bytes / 1024 / 1024).toFixed(2) + " MB";
            }

            function pad(value) {
                return value < 10 ? "0" + value : String(value);
            }

            function stamp() {
                var now = new Date();
                return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
                    "-" + pad(now.getHours()) + pad(now.getMinutes());
            }

            function download(name, text, mime) {
                var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
                var url = URL.createObjectURL(blob);
                var link = document.createElement("a");
                link.href = url;
                link.download = name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
            }

            function say(node, text, ok) {
                node.textContent = text;
                node.className = "db-msg " + (ok ? "ok" : "err");
            }

            function rowsOf(key) {
                try {
                    var parsed = JSON.parse(localStorage.getItem(key) || "null");
                    if (Array.isArray(parsed)) return parsed;
                    if (parsed && typeof parsed === "object") return Object.keys(parsed);
                    return null;
                } catch (error) {
                    return null;
                }
            }

            function renderStats() {
                var keys = allKeys();
                var total = 0;
                var body = "";
                keys.forEach(function (key) {
                    var raw = localStorage.getItem(key) || "";
                    var size = byteSize(raw);
                    total += size;
                    var rows = rowsOf(key);
                    var countText = rows ? rows.length + " 条" : "设置项";
                    body += "<tr><td>" + labelFor(key) + "</td><td>" + key +
                        "</td><td class='num'>" + countText + "</td><td class='num'>" +
                        prettySize(size) + "</td></tr>";
                });
                document.getElementById("stat-line").textContent =
                    "共 " + keys.length + " 项数据，占用 " + prettySize(total) + "。";
                document.getElementById("stat-table").innerHTML = keys.length
                    ? "<table class='db-table'><thead><tr><th>模块</th><th>存储键</th>" +
                      "<th class='num'>记录数</th><th class='num'>占用</th></tr></thead><tbody>" +
                      body + "</tbody></table>"
                    : "<div class='db-empty'>本机还没有数据，先去做几次练习再来备份。</div>";
            }

            function exportJson(msg) {
                var payload = {
                    app: APP_TAG,
                    version: VERSION,
                    exportedAt: new Date().toISOString(),
                    data: readAll(),
                };
                download("乐感工坊备份-" + stamp() + ".json",
                    JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
                say(msg, "已导出 " + Object.keys(payload.data).length + " 项数据。", true);
            }

            function exportCsv(msg) {
                var lines = ["模块,存储键,记录数,内容"];
                allKeys().forEach(function (key) {
                    var rows = rowsOf(key);
                    var value = rows ? rows.length + " 条" : "设置项";
                    var raw = (localStorage.getItem(key) || "").replace(/"/g, "\"\"");
                    lines.push("\"" + labelFor(key) + "\",\"" + key + "\",\"" + value + "\",\"" + raw + "\"");
                });
                download("乐感工坊成绩汇总-" + stamp() + ".csv",
                    "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
                say(msg, "已导出汇总表，可直接用 Excel 或 WPS 打开。", true);
            }

            function runImport(msg, fileNode, modeNode) {
                var file = fileNode.files && fileNode.files[0];
                if (!file) {
                    say(msg, "请先选择一个备份文件。", false);
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () {
                    var parsed;
                    try {
                        parsed = JSON.parse(String(reader.result));
                    } catch (error) {
                        say(msg, "文件不是有效的备份，未做任何改动。", false);
                        return;
                    }
                    if (!parsed || parsed.app !== APP_TAG || !parsed.data) {
                        say(msg, "这不是乐感工坊导出的备份，未做任何改动。", false);
                        return;
                    }
                    var data = parsed.data;
                    var count = 0;
                    try {
                        if (modeNode.value === "replace") localStorage.clear();
                        Object.keys(data).forEach(function (key) {
                            if (typeof data[key] === "string") {
                                localStorage.setItem(key, data[key]);
                                count += 1;
                            }
                        });
                    } catch (error) {
                        say(msg, "写入失败，可能是浏览器存储空间不足。", false);
                        return;
                    }
                    renderStats();
                    say(msg, "已" + (modeNode.value === "replace" ? "覆盖" : "合并") +
                        "导入 " + count + " 项数据。", true);
                };
                reader.readAsText(file, "utf-8");
            }

            function wipe(msg, wordNode) {
                if (wordNode.value.trim() !== "清空") {
                    say(msg, "请在输入框里输入“清空”后再点按钮。", false);
                    return;
                }
                try {
                    localStorage.clear();
                } catch (error) {
                    say(msg, "清空失败，请检查浏览器权限。", false);
                    return;
                }
                wordNode.value = "";
                renderStats();
                say(msg, "本机数据已清空。", true);
            }

            var exportMsg = document.getElementById("export-msg");
            document.getElementById("export-json").addEventListener("click", function () {
                exportJson(exportMsg);
            });
            document.getElementById("export-csv").addEventListener("click", function () {
                exportCsv(exportMsg);
            });
            document.getElementById("refresh").addEventListener("click", function () {
                renderStats();
                say(exportMsg, "统计已刷新。", true);
            });

            document.getElementById("import-run").addEventListener("click", function () {
                runImport(document.getElementById("import-msg"),
                    document.getElementById("import-file"),
                    document.getElementById("import-mode"));
            });

            document.getElementById("wipe-run").addEventListener("click", function () {
                wipe(document.getElementById("wipe-msg"), document.getElementById("wipe-word"));
            });

            renderStats();
        })();
    </script>
</body>
</html>
